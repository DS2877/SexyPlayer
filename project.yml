name: Aeria

options:
  bundleIdPrefix: com.aeriaplus
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

packages:
  # Plays the containers AVPlayer can't: MKV, AVI, raw MPEG-TS, rtmp/rtsp.
  # Community SPM wrapper around the stable VLCKit 3.6.0 binary (on tvOS it
  # re-exports TVVLCKit). VideoLAN's own SPM package only ships 4.0-alpha.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    exactVersion: "3.6.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID (developer.apple.com → Membership).
    # Safe to commit — it's embedded in every shipped app anyway.
    DEVELOPMENT_TEAM: "4YJN2S39Q4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Aeria:
    type: application
    platform: tvOS
    sources:
      # The whole TopShelf dir belongs to the extension target — pulling it into
      # the app also copies the extension's generated Info.plist as a resource,
      # which collides with the app's own Info.plist ("multiple commands
      # produce Aeria.app/Info.plist"). Only the shared payload type is shared.
      - path: Sources
        excludes:
          - "TopShelf/**"
      - path: Sources/TopShelf/TopShelfPayload.swift
      - path: Resources
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
      - target: AeriaTopShelf
      # The catalog store (`Sources/Data/Persistence`) uses the system SQLite via
      # `import SQLite3` — no SPM package, just the platform library.
      - sdk: libsqlite3.tbd
    entitlements:
      path: Sources/App/Aeria.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aeriaplus.appletv
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Aeria+
        UIUserInterfaceStyle: Dark
        # HTTPS-only / system crypto → no custom encryption. Skips the
        # export-compliance prompt on every upload.
        ITSAppUsesNonExemptEncryption: false
        # IPTV servers are very often plain HTTP. This is required for a working
        # IPTV client; the App Store review notes will explain it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Deep links from the Top Shelf extension: aeria://movie/<id>
        CFBundleURLTypes:
          - CFBundleURLName: com.aeriaplus.appletv
            CFBundleURLSchemes:
              - aeria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriaplus.appletv
        PRODUCT_NAME: Aeria
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  AeriaTopShelf:
    # tvOS Top Shelf content extension. If XcodeGen rejects this raw product
    # type, fall back to `type: app-extension`.
    type: com.apple.product-type.tv-app-extension
    platform: tvOS
    sources:
      - path: Sources/TopShelf
    entitlements:
      path: Sources/TopShelf/AeriaTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aeriaplus.appletv
    info:
      path: Sources/TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Aeria+ Top Shelf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriaplus.appletv.topshelf
        PRODUCT_NAME: AeriaTopShelf
        TARGETED_DEVICE_FAMILY: "3"

  AeriaTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/AeriaTests
    dependencies:
      - target: Aeria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aeriaplus.appletv.tests

schemes:
  Aeria:
    build:
      targets:
        Aeria: all
        AeriaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AeriaTests
    profile:
      config: Release
    archive:
      config: Release
