name: SexyPlayer

options:
  bundleIdPrefix: com.sexyplayer
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SexyPlayer:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: SexyPlayer
        UIUserInterfaceStyle: Dark
        # IPTV servers are very often plain HTTP. This is required for a working
        # IPTV client; the App Store review notes will explain it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sexyplayer.app
        PRODUCT_NAME: SexyPlayer
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  SexyPlayerTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/SexyPlayerTests
    dependencies:
      - target: SexyPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sexyplayer.app.tests

schemes:
  SexyPlayer:
    build:
      targets:
        SexyPlayer: all
        SexyPlayerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SexyPlayerTests
